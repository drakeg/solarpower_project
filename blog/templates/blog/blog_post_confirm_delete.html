{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
  <h1>Delete Blog Post</h1>
  <p>Are you sure you want to delete <strong>{{ blog_post.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete Post</button>
    <a href="{% url 'blog:blog_detail' blog_post.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
