name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Django system check
        env:
          SECRET_KEY: ci-only-secret-key
        run: python manage.py check

      - name: Run tests
        env:
          SECRET_KEY: ci-only-secret-key
        run: python manage.py test

      - name: Analyse Python code with Pylint
        run: |
          pylint --load-plugins=pylint_django \
            --django-settings-module=solarpower_project.settings \
            --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring,too-few-public-methods,invalid-name,line-too-long \
            $(git ls-files '*.py')


  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build

      - name: Run tests with Docker Compose
        run: docker compose run --rm test
