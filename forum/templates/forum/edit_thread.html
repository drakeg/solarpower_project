{% extends 'base.html' %}

{% block content %}
<h1>Edit Thread</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'forum:view_thread' thread.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
