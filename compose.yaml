services:
  web:
    build:
      context: .
    ports:
      - "${APP_PORT:-8000}:${CONTAINER_PORT:-8000}"
    environment:
      SECRET_KEY: "${SECRET_KEY:-docker-compose-local-development-key}"
      DEBUG: "${DEBUG:-True}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CONTAINER_PORT: "${CONTAINER_PORT:-8000}"
    volumes:
      - .:/app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:${CONTAINER_PORT}"

  test:
    build:
      context: .
    environment:
      SECRET_KEY: "${SECRET_KEY:-docker-compose-test-key}"
      DEBUG: "${DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}"
    command: python manage.py test
    profiles:
      - test
